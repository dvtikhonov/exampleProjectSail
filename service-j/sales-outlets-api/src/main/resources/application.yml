server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: service-j
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://host.docker.internal:3306/sail_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:12345678AS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

# POST в service-c перед отдачей /messenger. Пустые значения — страница открывается без записи.
messenger:
  choice:
    log-url: ${MESSENGER_CHOICE_LOG_URL:}
    log-token: ${MESSENGER_CHOICE_LOG_TOKEN:}

logging:
  level:
    root: INFO
    ru.sail.salesoutlets: INFO
    ru.sail.messenger: INFO
