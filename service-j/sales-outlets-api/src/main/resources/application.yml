server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: service-j
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

# POST в service-c: визит страницы и клик по мессенджеру. Пустые URL или токен — страница и редирект без записи.
# Хост URL должен быть в allowed-hosts (без учёта регистра). Иначе POST и токен не уходят.
messenger:
  choice:
    log-url: ${MESSENGER_CHOICE_LOG_URL:}
    click-log-url: ${MESSENGER_CHOICE_CLICK_LOG_URL:}
    log-token: ${MESSENGER_CHOICE_LOG_TOKEN:}
    allowed-hosts:
      - service-c

logging:
  level:
    root: INFO
    ru.sail.salesoutlets: INFO
    ru.sail.messenger: INFO
