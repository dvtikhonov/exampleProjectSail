# FPM listen.backlog=1024; nginx worker_connections=2048 (nginx.conf).
# keepalive reuses TCP to 127.0.0.1:9000 under deep VU spikes.
upstream php_fpm {
    server 127.0.0.1:9000;
    keepalive 32;
}

server {
    listen 8000;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # k6 client timeout ~60s — do not cut the server side earlier.
        fastcgi_read_timeout 120s;
    }

    location ~* \.(jpg|jpeg|png|css|js|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
