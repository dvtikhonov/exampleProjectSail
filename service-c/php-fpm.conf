[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
; Accept queue when all children are busy (align with nginx worker_connections).
listen.backlog = 1024
pm = dynamic
; Deep load (≈100 VU): multi-worker pool; artisan serve is single-threaded.
pm.max_children = 64
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
; Recycle workers on long soak to limit memory growth (overridable via PHP_FPM_MAX_REQUESTS).
pm.max_requests = 500
clear_env = no
